services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my_postgres_db
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - data_sql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openDatabase -d remoteDatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  adminer:
    image: adminer
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

volumes:
  data_sql:

networks:
  app_network: